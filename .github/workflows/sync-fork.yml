name: Sync fork with upstream

on:
  schedule:
    # Cada hora, en el minuto 0
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/block/buzz.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for changes
        id: check
        run: |
          git fetch origin
          LOCAL=$(git rev-parse origin/main)
          UPSTREAM=$(git rev-parse upstream/main)
          echo "local=$LOCAL upstream=$UPSTREAM"
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "Sin cambios"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Hay cambios nuevos upstream"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream into fork
        if: steps.check.outputs.changed == 'true'
        run: |
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "✅ Fork sincronizado con upstream"
          else
            "Está actualizado"
          fi
